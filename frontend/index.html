<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <!-- Header -->
    <header>
        <h1>Card Game</h1>
    </header>

    <!-- Start Game Button -->
    <button id="startGameButton">Start Game</button>

    <!-- Log Area -->
    <div id="log"></div>

    <!-- Input Area -->
    <div class="input-area">
        <input type="text" id="inputField" placeholder="Enter your input here" />
        <button id="sendButton">Send</button>
    </div>

    <!-- Players Information -->
    <div id="players-info">
        <h3>Players Information</h3>
        <div id="players-container">
            <!-- Player data will be dynamically inserted here -->
        </div>
    </div>
</div>

<!-- JavaScript File -->
<script src="app.js"></script>
</body>
</html>
